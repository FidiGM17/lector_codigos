name: cod_barras
description: App de inventario con lectura de código de barras/QR
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  #Uso de base de datos local
  sqflite: ^2.3.0
  path: ^1.9.0

  #Para el manejo de estados
  provider: ^6.1.1

  #Para el escaneo de códigos de barras o de QRs con la cámara
  mobile_scanner: ^5.1.1

  #Para manejar el formateo de fechas
  intl: ^0.19.0

  #Mantiene el modo oscuro entre sesiones si se desea
  shared_preferences: ^2.3.2

  #Para generar el PDF del ticket de venta
  pdf: ^3.11.1

  #Para mostrar la vista previa e imprimir, compartir o guardar el ticket
  printing: ^5.13.1

  #Para que el usuario suba el logo del negocio desde su galería
  image_picker: ^1.1.2

  #Para guardar una copia local del logo del negocio
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
